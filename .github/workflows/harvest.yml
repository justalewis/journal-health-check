name: Monthly harvest

on:
  schedule:
    - cron: "17 9 1 * *"   # 09:17 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      label:
        description: "Snapshot label (YYYY-MM); blank for this month"
        required: false

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      JHC_CONTACT_EMAIL: ${{ vars.JHC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q

      - name: Harvest
        run: python -m jhc harvest --fresh --quiet ${{ inputs.label && format('--label {0}', inputs.label) || '' }}

      - name: Commit snapshot
        run: |
          git config user.name "journal-health-check bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "harvest: snapshot $(date -u +%Y-%m)"
            git push
          fi

      # Deploys stay off until the repository variable DEPLOY_ENABLED is set
      # to "true", which happens only after the first deploy is approved.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: vars.DEPLOY_ENABLED == 'true'

      - name: Deploy
        if: vars.DEPLOY_ENABLED == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
