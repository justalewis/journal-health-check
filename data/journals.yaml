# Journals checked by Journal Health Check.
#
# Seeded on 2026-11-01 from Pinakes (Rhet-Comp-Index/journals.py): every
# journal in CROSSREF_, RSS_, SCRAPE_, MANUAL_ and UNAVAILABLE_JOURNALS, with
# the Pinakes display name kept as `name` so slugs and cross-links match.
# scripts/sync_journals.py adds new Pinakes titles without touching the
# fields below, which are curated here by hand:
#
#   issn_print / issn_online  verified against portal.issn.org on 2026-11-01
#                             (Crossref's issn-type for Crossref titles; the
#                             journal's own site for the rest)
#   crossref_issn             the ISSN Pinakes found Crossref indexes DOIs under
#   home_url                  the journal's own front page where it has one
#   platform                  ojs | wordpress | drupal | digital-commons |
#                             squarespace | bespoke | publisher | none
#   oa                        gold | bronze | hybrid | subscription
#   status                    active | dormant | ceased | unavailable
#   issn_note                 why an ISSN is missing or odd
#
# A blank field means "not known yet", never "doesn't exist".

journals:

